<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | SoCal Trail Log</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main"><div class="wrap narrow">
    <p id="unconfigured" class="panel" hidden>Accounts aren't available yet because the backend isn't configured. You can still <a href="index.html">browse trails</a>.</p>
    <div id="box">
      <div class="tabs" role="tablist">
        <button role="tab" data-mode="login" aria-selected="true">Log in</button>
        <button role="tab" data-mode="signup" aria-selected="false">Sign up</button>
        <button role="tab" data-mode="reset" aria-selected="false">Reset password</button>
      </div>
      <form id="form" novalidate>
        <h1 id="title">Log in</h1>
        <div id="emailRow"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
        <div id="pwRow"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div>
        <p id="err" class="error" role="alert"></p>
        <button class="btn" id="submit" type="submit">Log in</button>
      </form>
    </div>
  </div></main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
